<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRank — SEO & AEO</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Blanc par défaut, mode sombre seulement si tu cliques sur la lune.
    let t = 'light';
    try { t = localStorage.getItem('or-theme') || 'light'; } catch {}
    document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <img src="/logo.svg" alt="" width="30" height="30">
        <span>OpenRank</span>
      </a>
      <nav id="nav">
        <a href="#/" data-route="">Tableau de bord</a>
        <div class="nav-title">Analyse</div>
        <a href="#/domaine" data-route="domaine">Vue d'ensemble domaine</a>
        <a href="#/comparer" data-route="comparer">Analyse concurrentielle</a>
        <div class="nav-title">Mots-clés</div>
        <a href="#/mots-cles" data-route="mots-cles">Recherche de mots-clés</a>
        <a href="#/mot-cle" data-route="mot-cle">Analyse d'un mot-clé</a>
        <a href="#/positions" data-route="positions">Suivi de positions</a>
        <div class="nav-title">SEO technique</div>
        <a href="#/audit" data-route="audit">Audit de site</a>
        <a href="#/on-page" data-route="on-page">Optimiser une page</a>
        <a href="#/vitesse" data-route="vitesse">Vitesse du site</a>
        <div class="nav-title">IA &amp; AEO <span class="pill-new">Nouveau</span></div>
        <a href="#/ia" data-route="ia">Visibilité dans les IA</a>
        <a href="#/ia-pret" data-route="ia-pret">Site prêt pour les IA</a>
      </nav>
      <a class="nav-settings" href="#/reglages" data-route="reglages">Réglages &amp; clés</a>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <form class="search" id="globalSearch">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input name="q" placeholder="Tape un domaine (decathlon.fr) ou un mot-clé (chaussure running)" autocomplete="off">
          <button class="btn btn-primary" type="submit">Analyser</button>
        </form>
        <span class="engine-chip" id="engineChip" title="Moteur utilisé pour les positions"></span>
        <button class="icon-btn" id="themeBtn" aria-label="Mode sombre">
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
